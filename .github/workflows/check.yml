name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the registry script
        # jsonschema checks every file against schema/; without it those
        # tests are skipped.
        run: |
          pip install --quiet jsonschema==4.23.0
          python -m unittest discover -s scripts
      - name: Folders, meta.json, secrets and hosts
        env:
          # A provider's file sends everybody's key to its api host, so a
          # new host is a maintainer's decision, given by this label.
          ALLOW_HOST_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'host-change') }}
        run: python scripts/registry.py check --base origin/${{ github.base_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: conch's own check of every file
        run: |
          go install github.com/Amitgb14/conch/cmd/conch@master
          export CONCH_HOME="$(mktemp -d)"
          status=0
          # A sandbox provider that is off has no [ssh] yet; the rest must be clean.
          python scripts/registry.py conch-check || status=1
          # Integration files need a conch with conch integration; until
          # master has it, the registry's own checks above are all there is.
          if conch integration guide >/dev/null 2>&1; then
            # Every kind's folder, so a new kind (deploy, import, …) is checked
            # by conch without anybody remembering to add it here.
            for f in */*/integration.toml; do
              [ -e "$f" ] || continue
              conch integration check "$f" || status=1
            done
          else
            echo "::notice::this conch has no conch integration yet: integration files were not checked by conch"
          fi
          exit $status
      - name: The index builds
        run: python scripts/registry.py build "$(mktemp -d)"
